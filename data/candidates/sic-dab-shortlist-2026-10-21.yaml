# Structured transcription of the AIPE 10 kW DAB SiC device shortlist (datasheet-sourced).
# Reviewable candidate input for aipe_devices.importers.datasheet; NOT canonical evidence.
# Every value below is transcribed as printed in the cited manufacturer document (or, for the
# two TI reference-design parts, as cited by Texas Instruments). Nothing is estimated.
schema: aipe-datasheet-transcription/0.1
title: SiC MOSFET shortlist for the 10 kW DAB (800 V / 400 V, 100 kHz)
collected_on: "2026-10-21"
transcribed_from: repos/AIPE-Workflows/examples/dab-10kw/references/sic-device-shortlist.md
conventions:
  - Values are transcribed as printed; units are the printed units and the importer converts to SI.
  - Temperatures are printed in degC; the importer stores K. TC is case_temperature, TJ/Tvj is junction_temperature, THS is heatsink_temperature.
  - VSD points are printed as positive source-drain voltages at a positive source current; the importer stores the canonical third-quadrant convention (negative drain current, negative voltage drop) and keeps the printed value in source locators.
  - A printed single external gate resistance "RG" is stored as both gate_resistance_on and gate_resistance_off and flagged single_gate_resistance_printed.
  - The symbol L in switching test conditions is stored as test_inductance; whether it is the load or stray inductance is only known when the datasheet says so.
  - Conditions written once for a datasheet row (gate voltage, current, 25 degC) are carried to the row's typ/max variants and flagged conditions_inherited_from_row.
  - absent lists quantities the datasheet does not print or that were not retrieved; they must stay absent, never estimated.
  - basis is manufacturer_specified unless a value comes only from a product page (product_page) or a third-party document (third_party_cited).

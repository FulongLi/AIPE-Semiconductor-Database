[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aipe-devices"
version = "3.0.0"
description = "Canonical power semiconductor data and evidence infrastructure"
readme = "README.md"
license-files = ["LICENSING.md"]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
matlab = ["scipy>=1.11"]
dev = ["pytest>=8", "ruff>=0.9", "build>=1", "scipy>=1.11"]

[project.scripts]
aipe-devices = "aipe_devices.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
